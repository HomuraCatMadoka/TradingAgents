name: Miniapp Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'miniapp/frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'miniapp/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: miniapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
